name: FOLIO static Study Studio demo — verified GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - styles/**
      - tests/**
      - .github/workflows/folio-static-preview-pages.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-static-preview-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify synthetic-only browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Install Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit
      - name: Chromium regression
        env:
          FOLIO_BROWSER: chromium
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: WebKit regression
        env:
          FOLIO_BROWSER: webkit
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Capture synthetic-only preview screenshots
        run: python tests/capture_studio_preview.py
      - name: Store screenshots privately
        uses: actions/upload-artifact@v4
        with:
          name: folio-static-preview-private-evidence
          path: artifacts/studio-previews/*.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish verified static demo (no backend)
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare minimal public-only site
        run: |
          set -euo pipefail
          mkdir -p _site/styles
          cp index.html _site/index.html
          cp styles/studio-v2.css _site/styles/studio-v2.css
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -s _site/index.html
          test -s _site/styles/studio-v2.css
          test "$(find _site -type f | wc -l)" -eq 4
          echo 'Only the static demo index, local stylesheet, and metadata are published.'
      - name: Store minimal offline preview ZIP privately
        uses: actions/upload-artifact@v4
        with:
          name: folio-static-demo-files
          path: _site/
          retention-days: 7
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public-only site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
