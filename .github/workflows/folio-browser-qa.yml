name: FOLIO W03-01 browser QA (no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tests/**
      - .github/workflows/folio-browser-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser-regression:
    name: Chromium + WebKit (local synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR head exactly, not the synthetic GitHub merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local browser test dependency
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Install headless Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit
      - name: Chromium regression
        env:
          FOLIO_BROWSER: chromium
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: WebKit regression
        env:
          FOLIO_BROWSER: webkit
        run: python -m unittest discover -s tests -p "test_*.py" -v
